<!doctype html>
<html lang="ru" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#009BDE" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="RaskroyPro" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>3D-модель</title>
  </head>
  <body>
    <div id="root">
      <div id="boot" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#222;padding:16px;text-align:center">
        <img src="/app-icon.svg" alt="" style="width:min(46vw,220px);height:auto" onerror="this.style.display='none'" />
        <div style="font-size:22px;font-weight:600;color:#009BDE">RaskroyPro</div>
        <div id="boot-msg" style="font-size:14px;color:#888">Загрузка…</div>
      </div>
    </div>
    <script>
      // Если приложение не запустилось (не догрузились файлы, старый браузер) — вместо белого экрана объясняем, что делать.
      // React при запуске сам заменит этот экран, поэтому сообщение видно только при сбое.
      (function () {
        var shown = false
        var onMirror = /^ru\./i.test(location.hostname)
        function fail(reason) {
          if (shown || !document.getElementById('boot')) return
          shown = true
          var m = document.getElementById('boot-msg')
          var path = location.pathname + location.search
          var html = '<div style="font-size:16px;font-weight:600;color:#222;margin-bottom:8px">Приложение не загрузилось</div>'
          if (reason === 'old') {
            html += '<div style="max-width:420px;line-height:1.45">Браузер устарел. Обновите Chrome (меню ⋮ → Справка → О браузере) или откройте сайт в другом браузере.</div>'
          } else if (onMirror) {
            html += '<div style="max-width:420px;line-height:1.45">Проверьте интернет и обновите страницу.</div>'
          } else {
            html += '<div style="max-width:420px;line-height:1.45">Проверьте интернет и обновите страницу.<br><br><b>Вы в России?</b> Откройте зеркало приложения — оно работает без VPN:</div>' +
              '<a href="https://ru.raskroypro.com' + path + '" style="display:inline-block;margin-top:12px;padding:10px 18px;border-radius:10px;background:#009BDE;color:#fff;text-decoration:none;font-weight:600">Открыть ru.raskroypro.com</a>'
          }
          html += '<div style="margin-top:12px"><a href="' + path + '" style="color:#009BDE">Обновить страницу</a></div>'
          html += '<div style="margin-top:10px;font-size:13px"><a href="/check.html" style="color:#888">Проверить связь</a></div>'
          m.style.color = '#444'
          m.innerHTML = html
        }
        window.addEventListener('error', function (e) {
          if (e && e.error && e.error.name === 'SyntaxError') fail('old')
          // файл приложения не скачался (обрыв связи) — сразу говорим, а не ждём
          var t = e && e.target
          if (t && t !== window && (t.tagName === 'SCRIPT' || (t.tagName === 'LINK' && /modulepreload|stylesheet/.test(t.rel)))) fail('net')
        }, true)
        // Медленный интернет: приложение ещё скачивается — не пугаем «не загрузилось» (раньше через 15 с человек
        // видел ошибку, обновлял страницу, и загрузка начиналась заново). Ошибку показываем только через 2 минуты.
        setTimeout(function () {
          if (shown || !document.getElementById('boot')) return
          var m = document.getElementById('boot-msg')
          m.style.color = '#444'
          var html = '<div style="max-width:420px;line-height:1.45">Медленный интернет — приложение ещё загружается.<br>Не закрывайте и не обновляйте страницу.</div>'
          // Из России основной адрес без VPN часто не открывается вовсе — сразу подсказываем зеркало, а не через 2 минуты
          if (!onMirror) html += '<div style="max-width:420px;line-height:1.45;margin-top:14px"><b>Вы в России?</b> Откройте зеркало — оно работает без VPN:</div>' +
            '<a href="https://ru.raskroypro.com' + location.pathname + location.search + '" style="display:inline-block;margin-top:10px;padding:10px 18px;border-radius:10px;background:#009BDE;color:#fff;text-decoration:none;font-weight:600">Открыть ru.raskroypro.com</a>'
          m.innerHTML = html
        }, 12000)
        setTimeout(function () { fail('net') }, 120000)
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
